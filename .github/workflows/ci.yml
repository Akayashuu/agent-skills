name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate skills and type-check artifacts
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4.2.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-node@v4.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Validate SKILL.md frontmatter and JSON files
        run: node scripts/validate-skills.mjs

      - name: Install harness dependencies
        working-directory: tests
        run: pnpm install --frozen-lockfile

      - name: Type-check / compile skill code artifacts
        working-directory: tests
        run: node run.mjs

  php-lint:
    name: Lint PHP skill examples
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4.2.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # shivammathur/setup-php@v2
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.5'

      - name: Syntax-check skill .php examples
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' file; do
            found=1
            php -l "$file"
          done < <(find skills -path '*/examples/*.php' -print0)
          if [ "$found" -eq 0 ]; then
            echo "No PHP examples found" >&2
            exit 1
          fi

  go-lint:
    name: Compile Go skill examples
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4.2.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-go@v5.0.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.3'

      - name: Build each Go example as its own package
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' file; do
            found=1
            dir=$(mktemp -d)
            cp "$file" "$dir/main.go"
            ( cd "$dir" && go mod init example >/dev/null 2>&1 && go build ./... )
            rm -rf "$dir"
          done < <(find skills -path '*/examples/*.go' -print0)
          if [ "$found" -eq 0 ]; then
            echo "No Go examples found" >&2
            exit 1
          fi

  rust-lint:
    name: Type-check Rust skill examples
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4.2.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Type-check each Rust example as a library crate
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' file; do
            found=1
            out=$(mktemp)
            rustc --edition 2021 --crate-type lib --emit=metadata -o "$out" "$file"
            rm -f "$out"
          done < <(find skills -path '*/examples/*.rs' -print0)
          if [ "$found" -eq 0 ]; then
            echo "No Rust examples found" >&2
            exit 1
          fi
